name: Remove merged repair branch
on:
  push:
    branches: [main]
    paths: [.github/workflows/remove-merged-repair-branch.yml]
permissions:
  contents: write
  pull-requests: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = 'fix/local-discovery-lifecycle';
            const expected = 'acb3baac46b3e6c60c69dace7f5c4e01e55a0751';
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: 1 });
            if (!pr.merged || pr.base.ref !== 'main' || pr.head.ref !== branch ||
                pr.head.sha !== expected || pr.head.repo.full_name !== owner + '/' + repo) {
              throw new Error('Merged PR does not match the authorized branch.');
            }
            const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
              owner, repo, basehead: pr.merge_commit_sha + '...main'
            });
            if (!['ahead', 'identical'].includes(comparison.status)) {
              throw new Error('main does not contain the merged repair.');
            }
            let ref;
            try {
              ({ data: ref } = await github.rest.git.getRef({ owner, repo, ref: 'heads/' + branch }));
            } catch (error) {
              if (error.status === 404) {
                core.info('The old branch is already absent.');
                return;
              }
              throw error;
            }
            if (ref.object.sha !== expected) throw new Error('Branch has new commits; refusing deletion.');
            await github.rest.git.deleteRef({ owner, repo, ref: 'heads/' + branch });
            core.info('Deleted the merged repair branch; main and release tags retained.');
